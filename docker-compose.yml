version: '3.8'

services:
  # Backend Service (Hono + NeonDB API)
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: reguleran_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-postgresql://neondb_owner:npg_T1fexjBgDb7X@ep-frosty-heart-azufpdp9-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-sk_test_ZZ9tDSGqZVE5UlY6m1vlh3VhN5JpfwbTHYBVMZxjPU}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-nz0whrzy}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-466563443546532}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-vcBPvF4rieeqhTw0i7SHEnSBpak}
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173,https://reguleran.vercel.app

  # Frontend Service (Vite React + Nginx Proxy)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: reguleran_web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=/api
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_ZGlzdGluY3QtbmV3dC02Ny5jbGVyay5hY2NvdW50cy5kZXYk}
      - VITE_CLOUDINARY_CLOUD_NAME=${VITE_CLOUDINARY_CLOUD_NAME:-nz0whrzy}
      - VITE_CLOUDINARY_UPLOAD_PRESET=${VITE_CLOUDINARY_UPLOAD_PRESET:-reguleran_audio}
